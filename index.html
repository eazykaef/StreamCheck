<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamCheck - Проверка фильмов</title>
    <style>
        :root {
            --neon-red: #ff2a2a;
            --neon-green: #39ff14;
            --glass-bg: rgba(20, 20, 30, 0.7);
            --glass-border: rgba(255, 255, 255, 0.15);
        }
        
        body, html {
            margin: 0; padding: 0; min-height: 100%;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d0b14;
            color: white;
            overflow-x: hidden;
        }

        #bg-image {
            position: fixed; top: -5%; left: -5%; width: 110%; height: 110%;
            background-size: cover; background-position: center;
            filter: blur(30px) brightness(0.25);
            z-index: -1;
            transition: background-image 1s ease-in-out;
        }

        .container {
            max-width: 800px; margin: 60px auto; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }

        h1 {
            font-size: 2.5rem; font-weight: 800; text-align: center;
            margin-bottom: 40px; text-shadow: 0 4px 15px rgba(0,0,0,0.8);
            letter-spacing: 1px;
        }

        .search-box {
            display: flex; width: 100%; max-width: 650px; gap: 15px;
            margin-bottom: 30px; z-index: 10;
        }
        input {
            flex: 1; padding: 18px 25px; font-size: 1.1rem;
            border: 1px solid var(--glass-border); border-radius: 50px;
            background: rgba(0, 0, 0, 0.5); color: white;
            backdrop-filter: blur(10px); outline: none;
            transition: all 0.3s ease; box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        input:focus { border-color: #a855f7; box-shadow: 0 0 20px rgba(168, 85, 247, 0.5); }
        button {
            padding: 18px 35px; font-size: 1.1rem; font-weight: bold;
            border: none; border-radius: 50px;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            color: white; cursor: pointer; 
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(236, 72, 153, 0.4);
        }
        button:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(236, 72, 153, 0.6); }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 24px;
            padding: 35px; width: 100%; max-width: 750px; box-sizing: border-box;
            display: none; animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.05);
        }

        .verdict-box {
            text-align: center; padding: 25px; border-radius: 16px; margin-bottom: 30px;
            border: 2px solid transparent; backdrop-filter: blur(10px);
        }
        .verdict-box.allowed {
            background: rgba(57, 255, 20, 0.05); border-color: var(--neon-green);
            box-shadow: 0 0 25px rgba(57, 255, 20, 0.15), inset 0 0 15px rgba(57, 255, 20, 0.1);
        }
        .verdict-box.forbidden {
            background: rgba(255, 42, 42, 0.05); border-color: var(--neon-red);
            box-shadow: 0 0 25px rgba(255, 42, 42, 0.15), inset 0 0 15px rgba(255, 42, 42, 0.1);
        }
        .verdict-title { font-size: 1.8rem; font-weight: 900; margin: 0 0 12px 0; text-transform: uppercase; letter-spacing: 2px; }
        .allowed .verdict-title { color: var(--neon-green); text-shadow: 0 0 15px var(--neon-green); }
        .forbidden .verdict-title { color: var(--neon-red); text-shadow: 0 0 15px var(--neon-red); }
        .verdict-reasons { font-size: 1.15rem; color: rgba(255,255,255,0.9); margin: 0; line-height: 1.6; }
        
        .studio-list { font-size: 0.9rem; color: #888; margin-top: 15px; font-style: italic; }

        .movie-content { display: flex; gap: 35px; }
        .poster { width: 240px; border-radius: 14px; box-shadow: 0 15px 30px rgba(0,0,0,0.6); object-fit: cover; }
        .info { flex: 1; }
        .movie-title { font-size: 2.2rem; margin: 0 0 10px 0; font-weight: 800; }
        .movie-meta { color: #c4c4c4; font-size: 1.1rem; margin-bottom: 20px; font-weight: 500; }
        .movie-desc { line-height: 1.7; color: #e2e2e2; text-align: justify; font-size: 1.05rem; }

        .loading { font-size: 1.3rem; display: none; text-align: center; color: #a855f7; margin-top: 30px; animation: pulse 1.5s infinite; text-shadow: 0 0 10px #a855f7; }
        
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
        
        .shake { animation: shake 0.6s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 
            10%, 90% { transform: translate3d(-2px, 0, 0); } 
            20%, 80% { transform: translate3d(3px, 0, 0); } 
            30%, 50%, 70% { transform: translate3d(-5px, 0, 0); } 
            40%, 60% { transform: translate3d(5px, 0, 0); } 
        }

        @media(max-width: 700px) {
            .movie-content { flex-direction: column; align-items: center; }
            .poster { width: 100%; max-width: 260px; margin-bottom: 20px; }
            .info { text-align: center; }
            .movie-desc { text-align: center; }
        }
    </style>
</head>
<body>

<div id="bg-image"></div>

<div class="container">
    <h1>Проверка на АП (Twitch/YouTube)</h1>
    
    <div class="search-box">
        <input type="text" id="movieInput" placeholder="Введите название фильма..." onkeypress="if(event.key === 'Enter') checkMovie()">
        <button onclick="checkMovie()">Проверить</button>
    </div>
    
    <div id="loading" class="loading">Анализируем базы данных (Кинопоиск + Wikidata)...</div>

    <div id="movieCard" class="glass-card">
        <div id="statusBanner" class="verdict-box">
            <h2 id="statusText" class="verdict-title"></h2>
            <div id="statusReasons" class="verdict-reasons"></div>
            <div id="studioList" class="studio-list"></div>
        </div>
        
        <div class="movie-content">
            <img id="moviePoster" class="poster" src="" alt="Обложка">
            <div class="info">
                <h2 id="movieTitle" class="movie-title"></h2>
                <div id="movieMeta" class="movie-meta"></div>
                <div id="movieDescription" class="movie-desc"></div>
            </div>
        </div>
    </div>
</div>

<script>
    // ВАШ КЛЮЧ ТОЛЬКО ОТ КИНОПОИСКА (OMDb больше не нужен!)
    const KP_API_KEY = "ab5de608-2d16-4362-8e1b-22f05fc1c564"; 

    // Функция точного запроса к Wikidata (ищет продакшн и дистрибьюторов по IMDb ID)
    async function getStudiosFromWikidata(imdbId) {
        if (!imdbId) return [];
        // SPARQL запрос: P272 = производственная компания, P750 = дистрибьютор
        const query = `
            SELECT ?companyLabel WHERE {
              ?film wdt:P345 "${imdbId}" .
              { ?film wdt:P272 ?company . } 
              UNION 
              { ?film wdt:P750 ?company . }
              SERVICE wikibase:label { bd:serviceParam wikibase:language "en,ru". }
            }
        `;
        const url = `https://query.wikidata.org/sparql?query=${encodeURIComponent(query)}&format=json`;
        
        try {
            const res = await fetch(url, { headers: { 'Accept': 'application/sparql-results+json' } });
            const data = await res.json();
            // Возвращаем массив уникальных названий студий в нижнем регистре
            const companies = data.results.bindings.map(b => b.companyLabel.value.toLowerCase());
            return [...new Set(companies)];
        } catch (e) {
            console.error("Ошибка при запросе к Wikidata:", e);
            return [];
        }
    }

    async function checkMovie() {
        const query = document.getElementById('movieInput').value.trim();
        if (!query) return;

        const loading = document.getElementById('loading');
        const card = document.getElementById('movieCard');
        const bgImage = document.getElementById('bg-image');

        loading.style.display = 'block';
        card.style.display = 'none';
        card.classList.remove('shake');

        try {
            // 1. Поиск фильма через Кинопоиск
            const searchRes = await fetch(`https://kinopoiskapiunofficial.tech/api/v2.1/films/search-by-keyword?keyword=${encodeURIComponent(query)}`, {
                headers: { 'X-API-KEY': KP_API_KEY }
            });
            const searchData = await searchRes.json();

            if (!searchData.films || searchData.films.length === 0) {
                alert("Фильм не найден в базе.");
                loading.style.display = 'none';
                return;
            }

            const filmId = searchData.films[0].filmId;

            // 2. Получение деталей фильма от Кинопоиска
            const detailRes = await fetch(`https://kinopoiskapiunofficial.tech/api/v2.2/films/${filmId}`, {
                headers: { 'X-API-KEY': KP_API_KEY }
            });
            const filmData = await detailRes.json();

            const titleRu = filmData.nameRu || filmData.nameOriginal || "Без названия";
            const year = filmData.year ? parseInt(filmData.year, 10) : 0;
            const description = filmData.description || searchData.films[0].description || "Описание отсутствует.";
            const posterUrl = filmData.posterUrl || searchData.films[0].posterUrl || "";
            const length = filmData.filmLength ? `${filmData.filmLength} мин.` : "Неизвестно";
            const imdbId = filmData.imdbId;

            if (posterUrl) bgImage.style.backgroundImage = `url('${posterUrl}')`;

            // 3. Запрос к Wikidata для получения точного списка студий и дистрибьюторов
            const studiosArray = await getStudiosFromWikidata(imdbId);
            const studiosText = studiosArray.join(" | ");

            // 4. Логика проверок (строго по списку из Wikidata)
            let reasons = [];
            
            if (year > 2021) {
                reasons.push(`Фильм вышел позже 2021 года (Релиз: ${year} г.)`);
            }
            if (studiosText.includes("warner")) {
                reasons.push("Присутствуют права студии/дистрибьютора Warner Bros.");
            }
            if (studiosText.includes("netflix")) {
                reasons.push("Фильм выпущен платформой Netflix.");
            }
            if (studiosText.includes("amazon")) {
                reasons.push("Фильм выпущен платформой Amazon.");
            }

            // 5. Отрисовка
            document.getElementById('movieTitle').innerText = titleRu;
            document.getElementById('movieMeta').innerText = `Год: ${year || '?'} | Длительность: ${length}`;
            document.getElementById('movieDescription').innerText = description;
            document.getElementById('moviePoster').src = posterUrl;

            const statusBanner = document.getElementById('statusBanner');
            const statusText = document.getElementById('statusText');
            const statusReasons = document.getElementById('statusReasons');
            const studioListDiv = document.getElementById('studioList');

            if (reasons.length > 0) {
                statusBanner.className = 'verdict-box forbidden';
                statusText.innerText = '🚫 ФИЛЬМ НЕЛЬЗЯ СМОТРЕТЬ';
                statusReasons.innerHTML = "<strong>Найдены запреты:</strong><br>" + reasons.map(r => "— " + r).join('<br>');
                setTimeout(() => card.classList.add('shake'), 10);
            } else {
                statusBanner.className = 'verdict-box allowed';
                statusText.innerText = '✅ ФИЛЬМ МОЖНО СМОТРЕТЬ';
                statusReasons.innerText = 'Ни один из запрещающих критериев (Год > 2021, Warner, Netflix, Amazon) не обнаружен.';
            }

            // Показываем какие студии мы нашли для прозрачности
            if (studiosArray.length > 0) {
                // Делаем красивые заглавные буквы для вывода
                const prettyStudios = studiosArray.map(s => s.replace(/\b\w/g, l => l.toUpperCase())).join(", ");
                studioListDiv.innerText = `Студии/Дистрибьюторы: ${prettyStudios}`;
            } else {
                studioListDiv.innerText = "Данные о студиях не найдены (но запретов нет).";
            }

            loading.style.display = 'none';
            card.style.display = 'block';

        } catch (err) {
            loading.style.display = 'none';
            alert("Произошла ошибка проверки.");
            console.error(err);
        }
    }
</script>
</body>
</html>
